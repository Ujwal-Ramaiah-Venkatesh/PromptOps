[pytest]
# Pytest configuration for integration tests

# Test discovery
python_files = *_test.py test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    e2e: End-to-end workflow tests (slow, requires backend running)
    slow: Slow tests (>30s)
    integration: Integration tests
    smoke: Smoke tests (fast, critical paths only)

# Output
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Timeout
timeout = 600

# Coverage
# addopts = --cov=. --cov-report=html

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
