name: PromptOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_VERSION: '15'

jobs:
  # ============================================================================
  # Job 1: Lint & Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black isort mypy bandit
          pip install -r requirements.txt

      - name: Run Black (code formatting)
        run: black --check api_gateway/ phase1-nlp/ phase2-decomposition/ database/

      - name: Run isort (import sorting)
        run: isort --check-only api_gateway/ phase1-nlp/ phase2-decomposition/ database/

      - name: Run Flake8 (linting)
        run: flake8 api_gateway/ phase1-nlp/ phase2-decomposition/ database/ --max-line-length=100 --ignore=E203,W503

      - name: Run Bandit (security linting)
        run: bandit -r api_gateway/ phase1-nlp/ phase2-decomposition/ -ll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: frontend/dashboard
        run: npm run lint

      - name: Run TypeScript check
        working-directory: frontend/dashboard
        run: npx tsc --noEmit

  # ============================================================================
  # Job 2: Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pip-audit safety
          pip install -r requirements.txt

      - name: Run pip-audit (vulnerability scanning)
        run: pip-audit

      - name: Run Safety (dependency security)
        run: safety check --json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        working-directory: frontend/dashboard
        run: |
          npm ci
          npm audit --audit-level=moderate

  # ============================================================================
  # Job 3: Unit Tests (Python)
  # ============================================================================
  test-backend:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: promptops_test
          POSTGRES_USER: promptops
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://promptops:test_password@localhost:5432/promptops_test
        run: psql -h localhost -U promptops -d promptops_test -f database/schema.sql

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://promptops:test_password@localhost:5432/promptops_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend
          name: backend-coverage

  # ============================================================================
  # Job 4: Frontend Tests
  # ============================================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dashboard
        run: npm ci

      - name: Run tests
        working-directory: frontend/dashboard
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/dashboard/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ============================================================================
  # Job 5: Integration Tests
  # ============================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: promptops_test
          POSTGRES_USER: promptops
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://promptops:test_password@localhost:5432/promptops_test
        run: psql -h localhost -U promptops -d promptops_test -f database/schema.sql

      - name: Start API Gateway
        env:
          DATABASE_URL: postgresql://promptops:test_password@localhost:5432/promptops_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd api_gateway
          python main.py &
          sleep 10
          curl http://localhost:8000/health

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd tests/integration
          pytest e2e_workflows_test.py -v -m "not slow" --tb=short
        timeout-minutes: 15

  # ============================================================================
  # Job 6: Build Frontend
  # ============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: frontend/dashboard
        run: npm ci

      - name: Build production bundle
        working-directory: frontend/dashboard
        env:
          REACT_APP_API_BASE_URL: https://api.promptops.com/api/v1
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dashboard/build/
          retention-days: 7

  # ============================================================================
  # Job 7: Build & Push Docker Images
  # ============================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            promptops/api-gateway:latest
            promptops/api-gateway:${{ github.sha }}
          cache-from: type=registry,ref=promptops/api-gateway:buildcache
          cache-to: type=registry,ref=promptops/api-gateway:buildcache,mode=max

      - name: Build and push Context Collector
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.context
          push: true
          tags: |
            promptops/context-collector:latest
            promptops/context-collector:${{ github.sha }}

  # ============================================================================
  # Job 8: Deploy to Staging
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-docker, build-frontend, test-integration]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.promptops.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download frontend build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: frontend/dashboard/build/

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dashboard/build/ s3://promptops-staging-frontend/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_STAGING }} \
            --paths "/*"

      - name: Update ECS service (API Gateway)
        run: |
          aws ecs update-service \
            --cluster promptops-staging \
            --service api-gateway \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster promptops-staging \
            --services api-gateway

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging-api.promptops.com/health || exit 1
          echo "Staging deployment successful!"

  # ============================================================================
  # Job 9: Performance Tests (Nightly)
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [deploy-staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Locust
        run: |
          pip install -r tests/performance/requirements.txt

      - name: Run load tests
        run: |
          cd tests/performance
          locust -f load_test.py \
            --host=https://staging-api.promptops.com \
            --users 50 \
            --spawn-rate 10 \
            --run-time 5m \
            --headless \
            --html report.html

      - name: Upload performance report
        uses: actions/upload-artifact@v3
        with:
          name: performance-report
          path: tests/performance/report.html

  # ============================================================================
  # Job 10: Deploy to Production (Manual Approval)
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://promptops.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download frontend build
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: frontend/dashboard/build/

      - name: Deploy frontend to S3
        run: |
          aws s3 sync frontend/dashboard/build/ s3://promptops-production-frontend/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }} \
            --paths "/*"

      - name: Update ECS service (API Gateway)
        run: |
          aws ecs update-service \
            --cluster promptops-production \
            --service api-gateway \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster promptops-production \
            --services api-gateway

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://api.promptops.com/health || exit 1
          echo "Production deployment successful!"

      - name: Notify deployment
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Production deployment successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Production Deployment*\n✅ Successfully deployed commit ${{ github.sha }}\n\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|View commit>"
                  }
                }
              ]
            }
