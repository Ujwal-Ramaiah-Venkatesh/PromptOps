name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 api_gateway tests phase1-nlp --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 api_gateway tests phase1-nlp --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check formatting with black
      run: |
        black --check api_gateway tests phase1-nlp/discovery phase1-nlp/context || true
      continue-on-error: true

  typescript-lint:
    name: TypeScript Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/dashboard/package-lock.json

    - name: Install dependencies
      working-directory: frontend/dashboard
      run: npm ci

    - name: Run ESLint
      working-directory: frontend/dashboard
      run: npm run lint || true
      continue-on-error: true

    - name: TypeScript check
      working-directory: frontend/dashboard
      run: npx tsc --noEmit || true
      continue-on-error: true
