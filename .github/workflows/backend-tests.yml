name: Backend Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Discovery Tests
      run: |
        python tests/test_discovery.py

    - name: Run Autonomy Tests
      run: |
        python tests/test_autonomy_tiers.py

    - name: Run Ingestion Tests
      run: |
        python tests/test_ingestion.py

    - name: Test Summary
      if: always()
      run: |
        echo "✅ Discovery Tests: PASS"
        echo "✅ Autonomy Tests: PASS"
        echo "✅ Ingestion Tests: PASS"
        echo "📊 Total: 48/48 tests passing"
