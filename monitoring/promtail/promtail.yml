# Promtail Configuration
# ======================
#
# Log shipping configuration for PromptOps
# Phase 5A - Production Deployment
#
# Author: PromptOps Team

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Backend application logs
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          environment: production
          __path__: /app/logs/backend*.log

  # Frontend logs
  - job_name: frontend
    static_configs:
      - targets:
          - localhost
        labels:
          job: frontend
          environment: production
          __path__: /app/logs/frontend*.log

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          environment: production
          __path__: /var/log/syslog

  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

# Pipeline stages for log processing
pipeline_stages:
  # Parse JSON logs
  - json:
      expressions:
        timestamp: timestamp
        level: level
        message: message
        module: module

  # Extract timestamp
  - timestamp:
      source: timestamp
      format: RFC3339

  # Add labels
  - labels:
      level:
      module:

  # Filter out debug logs in production
  - match:
      selector: '{level="DEBUG"}'
      action: drop

  # Add metrics
  - metrics:
      log_lines_total:
        type: Counter
        description: "Total number of log lines"
        prefix: promtail_
        max_idle_duration: 24h
        config:
          match_all: true
          action: inc

      log_bytes_total:
        type: Counter
        description: "Total bytes of logs"
        prefix: promtail_
        max_idle_duration: 24h
        config:
          match_all: true
          count_entry_bytes: true
          action: add
