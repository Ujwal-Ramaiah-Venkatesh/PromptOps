# Grafana Datasources Configuration
# ==================================
#
# Auto-provisioned datasources for Grafana
# Phase 5A - Production Deployment
#
# Author: PromptOps Team

apiVersion: 1

datasources:
  # Prometheus datasource
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "30s"
      httpMethod: "POST"

  # Loki datasource for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60s

  # PostgreSQL datasource (optional, for direct DB queries)
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: promptops
    user: ${POSTGRES_USER}
    editable: false
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
