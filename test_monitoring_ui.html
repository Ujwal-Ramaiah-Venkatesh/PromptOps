<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Monitoring Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            margin-bottom: 24px;
        }
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .metric-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 8px;
        }
        .metric-value {
            font-size: 32px;
            font-weight: bold;
        }
        .metric-unit {
            font-size: 14px;
            opacity: 0.8;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        button:hover {
            opacity: 0.9;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            color: #333;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }
        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        #log {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Security & Performance Monitoring Test</h1>

        <div id="status" class="status info">Connecting to API...</div>

        <h2>System Metrics</h2>
        <div class="metrics-grid" id="metrics">
            <div class="metric-card">
                <div class="metric-label">CPU Usage</div>
                <div class="metric-value" id="cpu">--</div>
                <div class="metric-unit">%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Memory Usage</div>
                <div class="metric-value" id="memory">--</div>
                <div class="metric-unit">%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Disk Usage</div>
                <div class="metric-value" id="disk">--</div>
                <div class="metric-unit">%</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Active Threads</div>
                <div class="metric-value" id="threads">--</div>
                <div class="metric-unit">threads</div>
            </div>
        </div>

        <h2>Quick Tests</h2>
        <div class="input-group">
            <label>Target URL:</label>
            <input type="url" id="targetUrl" placeholder="https://your-app.s3-website-us-east-1.amazonaws.com">
        </div>
        <div class="input-group">
            <label>S3 Bucket Name:</label>
            <input type="text" id="bucketName" placeholder="your-bucket-name">
        </div>

        <button onclick="runLoadTest()" id="loadTestBtn">🚀 Run Load Test</button>
        <button onclick="runSecurityScan()" id="securityScanBtn">🔒 Security Scan</button>
        <button onclick="runCrashTest()" id="crashTestBtn">💥 Test High Load</button>
        <button onclick="getAlerts()">⚠️ Get Alerts</button>

        <h2>Activity Log</h2>
        <div id="log">Initializing...</div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let refreshInterval;

        function log(message, type = 'info') {
            const logEl = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logEl.textContent += `[${timestamp}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
        }

        async function fetchMetrics() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/advanced-monitoring/metrics/system`);
                const data = await response.json();

                document.getElementById('cpu').textContent = data.current.cpu_percent.toFixed(1);
                document.getElementById('memory').textContent = data.current.memory_percent.toFixed(1);
                document.getElementById('disk').textContent = data.current.disk_percent.toFixed(1);
                document.getElementById('threads').textContent = data.current.active_threads;

                updateStatus(`✅ Connected - Status: ${data.status}`, 'success');
                log('Metrics updated successfully');
            } catch (error) {
                updateStatus(`❌ Failed to fetch metrics: ${error.message}`, 'error');
                log(`Error: ${error.message}`, 'error');
            }
        }

        async function runLoadTest() {
            const targetUrl = document.getElementById('targetUrl').value;
            if (!targetUrl) {
                alert('Please enter target URL');
                return;
            }

            const btn = document.getElementById('loadTestBtn');
            btn.disabled = true;
            log('🚀 Starting load test...');

            try {
                const response = await fetch(`${API_BASE}/api/v1/advanced-monitoring/tests/load`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_url: targetUrl,
                        duration_seconds: 30,
                        concurrent_users: 10,
                        requests_per_second: 50,
                        ramp_up_seconds: 5,
                        test_type: 'load_test'
                    })
                });

                const data = await response.json();
                log(`✅ Load test started: ${data.test_id}`);
                log(`Monitor progress at: ${API_BASE}/api/v1/advanced-monitoring/tests/${data.test_id}`);

                setTimeout(() => btn.disabled = false, 35000);
            } catch (error) {
                log(`❌ Load test failed: ${error.message}`, 'error');
                btn.disabled = false;
            }
        }

        async function runSecurityScan() {
            const targetUrl = document.getElementById('targetUrl').value;
            const bucketName = document.getElementById('bucketName').value;

            if (!targetUrl || !bucketName) {
                alert('Please enter both target URL and bucket name');
                return;
            }

            const btn = document.getElementById('securityScanBtn');
            btn.disabled = true;
            log('🔒 Starting security scan...');

            try {
                const response = await fetch(`${API_BASE}/api/v1/advanced-monitoring/tests/security`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_url: targetUrl,
                        bucket_name: bucketName,
                        region: 'us-east-1',
                        scan_depth: 'comprehensive',
                        check_ssl: true,
                        check_headers: true,
                        check_vulnerabilities: true
                    })
                });

                const data = await response.json();
                log(`✅ Security scan started: ${data.test_id}`);

                setTimeout(() => btn.disabled = false, 30000);
            } catch (error) {
                log(`❌ Security scan failed: ${error.message}`, 'error');
                btn.disabled = false;
            }
        }

        async function runCrashTest() {
            const targetUrl = document.getElementById('targetUrl').value;
            if (!targetUrl) {
                alert('Please enter target URL');
                return;
            }

            const btn = document.getElementById('crashTestBtn');
            btn.disabled = true;
            log('💥 Starting crash simulation...');

            try {
                const response = await fetch(`${API_BASE}/api/v1/advanced-monitoring/tests/crash`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        target_url: targetUrl,
                        crash_type: 'high_load',
                        duration_seconds: 20,
                        intensity: 5
                    })
                });

                const data = await response.json();
                log(`✅ Crash simulation started: ${data.test_id}`);

                setTimeout(() => btn.disabled = false, 25000);
            } catch (error) {
                log(`❌ Crash simulation failed: ${error.message}`, 'error');
                btn.disabled = false;
            }
        }

        async function getAlerts() {
            log('⚠️ Fetching alerts...');
            try {
                const response = await fetch(`${API_BASE}/api/v1/advanced-monitoring/alerts?limit=10`);
                const data = await response.json();

                if (data.total === 0) {
                    log('✅ No alerts - system is healthy!');
                } else {
                    log(`Found ${data.total} alerts:`);
                    data.alerts.forEach(alert => {
                        log(`  [${alert.severity.toUpperCase()}] ${alert.title}`);
                    });
                }
            } catch (error) {
                log(`❌ Failed to fetch alerts: ${error.message}`, 'error');
            }
        }

        // Initialize
        log('Initializing monitoring system...');
        fetchMetrics();
        refreshInterval = setInterval(fetchMetrics, 10000);

        log('✅ Ready! Enter your target URL and bucket name above.');
        log('Click any button to run tests.');
    </script>
</body>
</html>
