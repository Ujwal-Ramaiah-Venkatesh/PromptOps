<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptOps Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0e27;
        }

        .banner {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Animated background grid */
        .grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: float 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 30%; top: 40%; animation-delay: 2s; }
        .particle:nth-child(3) { left: 50%; top: 60%; animation-delay: 4s; }
        .particle:nth-child(4) { left: 70%; top: 30%; animation-delay: 6s; }
        .particle:nth-child(5) { left: 85%; top: 70%; animation-delay: 8s; }
        .particle:nth-child(6) { left: 20%; top: 80%; animation-delay: 10s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-30px) translateX(20px); }
            50% { transform: translateY(-60px) translateX(-20px); }
            75% { transform: translateY(-30px) translateX(10px); }
        }

        /* Content container */
        .content {
            position: relative;
            z-index: 10;
            padding: 60px 80px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Logo section */
        .logo-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 800;
            color: #667eea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .logo::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: #764ba2;
            border-radius: 50%;
            top: -5px;
            right: -5px;
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.5);
        }

        .logo-text {
            font-size: 48px;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: -1px;
        }

        /* Main content */
        .main-content {
            margin-top: 40px;
        }

        .tagline {
            font-size: 36px;
            font-weight: 700;
            color: white;
            line-height: 1.4;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        /* Icons section */
        .features {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .feature-icon {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .feature-icon svg {
            width: 24px;
            height: 24px;
            fill: white;
        }

        .feature-icon span {
            color: white;
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Bottom section */
        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-badge {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #1a1a2e;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 18px;
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="grid"></div>
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="content">
            <div class="logo-section">
                <div class="logo">P</div>
                <div class="logo-text">PromptOps</div>
            </div>

            <div class="main-content">
                <div class="tagline">
                    Empowering DevOps, Security, Infrastructure,<br>
                    Cloud Engineering, and Site Reliability Engineering<br>
                    in a single AI-powered cloud operations control tower.
                </div>

                <div class="features">
                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18.5c-4.28-1.05-7-5.35-7-9.5V8.3l7-3.11v15.31z"/>
                        </svg>
                        <span>DevOps</span>
                    </div>

                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                        </svg>
                        <span>Security</span>
                    </div>

                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 13H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1v-6c0-.55-.45-1-1-1zM7 19c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM20 3H4c-.55 0-1 .45-1 1v6c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V4c0-.55-.45-1-1-1zM7 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                        </svg>
                        <span>Infrastructure</span>
                    </div>

                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3s-1.34 3-3 3H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h.71C7.37 7.69 9.48 6 12 6v2c-1.82 0-3.41.88-4.41 2.24L6.5 11.5H6c-1.1 0-2 .9-2 2s.9 2 2 2h13c.55 0 1-.45 1-1s-.45-1-1-1h-1.5v-1.5c0-2.21-1.79-4-4-4s-4 1.79-4 4v1.5H6c-1.66 0-3-1.34-3-3s1.34-3 3-3h.71c.37-2.37 2.31-4.24 4.79-4.24 2.76 0 5 2.24 5 5v.5H19c1.1 0 2 .9 2 2s-.9 2-2 2z"/>
                        </svg>
                        <span>Cloud</span>
                    </div>

                    <div class="feature-icon">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                        </svg>
                        <span>SRE</span>
                    </div>
                </div>
            </div>

            <div class="bottom-section">
                <div class="ai-badge">
                    ⚡ AI-Powered Automation
                </div>
                <div class="status">
                    <div class="status-dot"></div>
                    Production Ready
                </div>
            </div>
        </div>
    </div>
</body>
</html>
