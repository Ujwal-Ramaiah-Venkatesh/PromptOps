name: Android CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: netSenseAI-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7

  lint:
    name: Run Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew :androidApp:lint --stacktrace

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: androidApp/build/reports/lint-results-*.html
          retention-days: 7

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [build, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: netSenseAI-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create Release Tag
        if: success()
        run: |
          VERSION_NAME=$(grep "versionName" androidApp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "versionCode" androidApp/build.gradle.kts | sed 's/[^0-9]*//g')
          echo "VERSION_TAG=v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_ENV
          echo "APK_PATH=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f)" >> $GITHUB_ENV

      - name: Generate Release Notes
        if: success()
        run: |
          echo "## NetSenseAI Release ${{ env.VERSION_TAG }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### Changes in this release:" >> release_notes.md
          git log -5 --pretty=format:"- %s (%an)" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Build Information" >> release_notes.md
          echo "- Build Date: $(date +'%Y-%m-%d %H:%M:%S UTC')" >> release_notes.md
          echo "- Commit: ${{ github.sha }}" >> release_notes.md
          echo "- Branch: ${{ github.ref_name }}" >> release_notes.md
